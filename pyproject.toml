[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "u-rescue"
version = "0.1.0"
description = "Flood-aware route decision support for Hyderabad and Sangareddy"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "networkx>=3.1", "fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["u_rescue*"]
